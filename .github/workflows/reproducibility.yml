name: Reproducibility Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce:
    name: Clean Ubuntu Reproducibility Verification (35 JSONL Datasets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Cryptographic SHA-256 Manifest
        run: |
          python3 scripts/verify_manifest.py

      - name: Run Automated Test Suite
        run: |
          pytest -q

      - name: Reproduce Quad-Platform Analysis over 35 Raw JSONL Datasets
        run: |
          python3 scripts/reproduce_quad_platform_analysis.py

      - name: Verify Post-Reproduction Test Suite
        run: |
          pytest -q
