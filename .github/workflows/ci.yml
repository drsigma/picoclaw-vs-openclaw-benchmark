name: Benchmark Suite CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests and Linter (macOS ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest numpy scipy matplotlib python-docx dulwich

      - name: Run Ruff Linter
        run: |
          ruff check benchmark/ tests/

      - name: Run Pytest Suite
        run: |
          pytest -v tests/
