name: Benchmark Suite CI / CD

on:
  push:
    branches: [ main, feat/peer-review-revisions ]
  pull_request:
    branches: [ main, feat/peer-review-revisions ]

jobs:
  test:
    name: Test & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-docx

      - name: Run Ruff Linter
        run: |
          ruff check benchmark/ tests/ scripts/

      - name: Run Pytest Suite
        run: |
          pytest -q tests/

      - name: Run Reviewer Fast Dry-Run Integration Test
        run: |
          python benchmark/run_unified_benchmark.py --dry-run --output-dir ci_dry_run_output

      - name: Run Cryptographic Manifest Verification
        run: |
          python scripts/verify_manifest.py
